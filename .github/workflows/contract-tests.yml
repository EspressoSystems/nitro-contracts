name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - develop

jobs:
  test-unit:
    name: Test unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
          cache: false

      - name: Setup node/yarn
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Install packages
        run: yarn

      - name: Build
        run: yarn test:foundry
  tests:
    name: Contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
          cache: false

      - name: Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
          cache: false

      - name: Check Contracts Format
        run: |
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.sol')
          if [ -n "$changed_files" ]; then
            echo "$changed_files" | xargs forge fmt --check
          fi

      - name: Install dependencies
        run: yarn install

      - name: Lint Contracts
        run: yarn solhint

      - name: Lint Test Scripts
        run: yarn lint:test

      - name: Compare bytecodes
        run: yarn test:bytecodes

      - name: Build
        run: yarn build:all

      - name: Run tests
        run: yarn hardhat --network hardhat test test/contract/*.spec.ts

      # - name: Interface compatibility
      #   run: yarn run test:compatibility

      - name: Forge build
        run: forge build

      - name: Test size
        run: yarn contract:size

      - name: Test Storage Layouts
        run: yarn run test:storage

      - name: Test function signatures
        run: yarn run test:signatures

      - name: Run unused Solidity errors checker
        uses: OffchainLabs/actions/check-unused-errors@main
        with:
          directory: "./src"
          exceptions_file: "./test/unused-errors/exceptions.txt"

      - name: Run coverage
        run: yarn hardhat coverage --testfiles "test/contract/*.spec.ts"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          fail_ci_if_error: false
          files: ./contracts/coverage.json
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload 4bytes
        continue-on-error: true
        run: yarn upload-4bytes

  test-4844:
    name: 4844 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
          cache: false

      - uses: OffchainLabs/actions/run-nitro-test-node@main
        with:
          args: --pos
          no-token-bridge: true

      - name: Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build:all

      - name: Test 4844
        run: yarn test:4844

  test-e2e:
    name: Test e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout nitro-testnode
        uses: actions/checkout@v4
        with:
          repository: EspressoSystems/nitro-testnode
          submodules: true
          path: nitro-testnode
          ref: integrate-cas

      - name: Start nitro test node
        shell: bash
        run: |
          cd nitro-testnode
          export NITRO_CONTRACTS_BRANCH="${{ github.event.pull_request.head.sha || github.sha }}"
          ./test-node.bash --init --no-simple --l3node --no-tokenbridge &

      - name: Wait for nitro startup
        shell: bash
        run: |
          while ! curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":45678,"method":"eth_chainId","params":[]}' \
            "http://localhost:8547"; do sleep 10; done

      - name: Wait for L3 startup
        shell: bash
        run: |
          while ! curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":45678,"method":"eth_chainId","params":[]}' \
            "http://localhost:3347"; do sleep 10; done

      - name: Setup node/yarn
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Install packages
        run: yarn

      - name: Compile contracts
        run: yarn build

      - name: Run e2e tests
        run: yarn test:e2e

